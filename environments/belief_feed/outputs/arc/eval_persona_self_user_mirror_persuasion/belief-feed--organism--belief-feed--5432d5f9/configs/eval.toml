# configs/arc.toml plus Qwen3's non-thinking mode. The organism is fine-tuned with TRL's Qwen3
# training template, which renders an empty <think></think> per turn, so it must be served with
# enable_thinking=false. This has to be a TOML table: a CLI string reaches vLLM as a string.
num_rollouts = 1
push = false

[env.taskset]
id = "belief-feed"

[env.agent.runtime]
type = "subprocess"

[sampling.chat_template_kwargs]
enable_thinking = false

# The ARC LLM API allows 10 requests in flight per user per model (429) and its backends can be
# briefly unavailable (502/503). Re-run such episodes from the start instead of losing them.
[[env.retries.rules]]
type = "ProviderError"
status_code = [429, 502, 503]
max_retries = 100
